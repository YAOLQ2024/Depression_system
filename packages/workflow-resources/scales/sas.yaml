scoring:
  method: standard_score
  raw_score_formula: sum(item_scores)
  standard_score_formula: int(raw_score * 1.25)
  raw_score_range: [20, 80]
  derived_score_range: [25, 100]
  verification_status: needs_reverse_item_review
  normalized_output:
    method: linear
    source_score: derived_score
    minimum: 25
    maximum: 100
  severity_rules:
    - min: 0
      max: 49
      level: normal
      label: 正常
    - min: 50
      max: 59
      level: mild
      label: 轻度焦虑
    - min: 60
      max: 69
      level: moderate
      label: 中度焦虑
    - min: 70
      max: 100
      level: severe
      label: 重度焦虑
notes:
  - 量表条目已结构化
  - 反向计分题目需根据原始量表版本二次核对后再锁定实现
