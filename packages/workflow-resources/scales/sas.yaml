version: 1
source:
  path: /home/ZR/data2/MCS/docs/scale/SAS焦虑自评量表.docx
  extraction_status: structured_from_docx_review_required
metadata:
  code: SAS
  slug: sas
  name: SAS 焦虑自评量表
  short_name: SAS
  mode: voice_self_report
  timeframe: 最近一星期
  item_count: 20
answer_options:
  - score: 1
    label: 没有或很少时间
  - score: 2
    label: 小部分时间
  - score: 3
    label: 相当多时间
  - score: 4
    label: 绝大部分或全部时间
items:
