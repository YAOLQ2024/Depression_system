  - { id: q2, index: 2, text: 我无缘无故地感到害怕 }
  - { id: q3, index: 3, text: 我容易心里烦乱或觉得惊恐 }
  - { id: q4, index: 4, text: 我觉得我可能将要发疯 }
  - { id: q5, index: 5, text: 我觉得一切都很好，也不会发生什么不幸 }
  - { id: q6, index: 6, text: 我手脚发抖打颤 }
  - { id: q7, index: 7, text: 我因为头痛、颈痛和背痛而苦恼 }
  - { id: q8, index: 8, text: 我感觉容易衰弱和疲乏 }
  - { id: q9, index: 9, text: 我觉得心平气和，并且容易安静坐着 }
  - { id: q10, index: 10, text: 我觉得心跳得很快 }
  - { id: q11, index: 11, text: 我因为一阵阵头晕而苦恼 }
  - { id: q12, index: 12, text: 我有晕倒发作或觉得要晕倒似的 }
  - { id: q13, index: 13, text: 我呼气吸气都感到很容易 }
  - { id: q14, index: 14, text: 我手脚麻木和刺痛 }
