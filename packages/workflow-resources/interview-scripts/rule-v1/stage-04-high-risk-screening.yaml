version: 1
stage_id: stage-04-high-risk-screening
title: 高风险问题排查
source_document: /home/ZR/data2/MCS/docs/交互剧本.txt
revision: teacher-confirmed-review-branch-2026-06
entry_node: ask-suicidal-ideation
slots:
  - suicidal_ideation
  - suicide_means_preparation
  - suicide_farewell_behavior
  - self_harm_behavior
  - suicide_plan
  - primary_concern
  - high_risk_positive_count
  - high_risk_confirmation_outcome
  - high_risk_flag
  - high_risk_reason
  - high_risk_screening_stage_summary
completion_outcomes:
  - safe_to_continue
  - human_intervention_required
nodes:
  - id: ask-suicidal-ideation
    type: speak_then_wait
    prompt: 最近有没有伤害自己或轻生的想法？
    extraction:
      strategy: risk_enum_parse
      target_slot: suicidal_ideation
      enums:
        - positive
        - negative
        - unclear
    branches:
      normal:
        next: evaluate-after-suicidal-ideation
      silence:
        after_seconds: 6
        next: evaluate-after-suicidal-ideation
      recognition_failure:
        next: evaluate-after-suicidal-ideation

  - id: evaluate-after-suicidal-ideation
    type: decision
    decision_rules:
      enter-review-branch:
        any:
          - suicidal_ideation == positive
      safe_to_continue:
        default: true
    branches:
      enter-review-branch: ask-suicide-means-preparation
      safe_to_continue: ask-primary-concern

  - id: ask-suicide-means-preparation
    type: speak_then_wait
    prompt: 最近有没有囤积安眠药、刀具、绳索，主动查找自杀相关信息、教程的想法？
    extraction:
      strategy: risk_enum_parse
      target_slot: suicide_means_preparation
      enums:
        - positive
        - negative
        - unclear
    branches:
      normal:
        next: ask-suicide-farewell-behavior
      silence:
        after_seconds: 6
        next: ask-suicide-farewell-behavior
      recognition_failure:
        next: ask-suicide-farewell-behavior

  - id: ask-suicide-farewell-behavior
    type: speak_then_wait
    prompt: 最近有没有道别，整理物品，写遗书，交代后事的想法？
    extraction:
      strategy: risk_enum_parse
      target_slot: suicide_farewell_behavior
      enums:
        - positive
        - negative
        - unclear
    branches:
      normal:
        next: ask-plan-or-action
      silence:
        after_seconds: 6
        next: ask-plan-or-action
      recognition_failure:
        next: ask-plan-or-action

  - id: ask-plan-or-action
    type: speak_then_wait
    prompt: 有没有具体计划、差点实施，或者已经做过？
    extraction:
      strategy: risk_enum_parse
      target_slots:
        - suicide_plan
        - self_harm_behavior
      enums:
        - positive
        - negative
        - unclear
    branches:
      normal:
        next: evaluate-high-risk
      silence:
        after_seconds: 6
        next: evaluate-high-risk
      recognition_failure:
        next: evaluate-high-risk

  - id: evaluate-high-risk
    type: decision
    decision_rules:
      human_intervention_required:
        any:
          - high_risk_confirmation_outcome == confirmed
      safe_to_continue:
        default: true
    branches:
      human_intervention_required: risk-screening-005
      safe_to_continue: ask-primary-concern-after-review

  - id: ask-primary-concern
    type: speak_then_wait
    prompt: 这次就诊您最希望医生帮您解决什么问题？
    extraction:
      strategy: free_text
      target_slot: primary_concern
    branches:
      normal:
        next: stage-complete
      silence:
        after_seconds: 6
        next: stage-complete
      recognition_failure:
        next: stage-complete

  - id: ask-primary-concern-after-review
    type: speak_then_wait
    prompt: 这次就诊您最希望医生帮您解决什么问题？
    extraction:
      strategy: free_text
      target_slot: primary_concern
    branches:
      normal:
        next: stage-complete
      silence:
        after_seconds: 6
        next: stage-complete
      recognition_failure:
        next: stage-complete

  - id: risk-screening-005
    type: speak_then_complete
    prompt: 系统识别到您当前可能存在需要立即关注的安全风险。接下来我会暂停标准流程，并协助转入人工支持或进一步安全处理。
    next: stage-complete
