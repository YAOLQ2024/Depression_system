version: 1
stage_id: stage-04-high-risk-screening
title: 高风险问题排查
source_document: /home/ZR/data2/MCS/docs/交互剧本.txt
revision: teacher-confirmed-flow-2026-04
entry_node: ask-suicidal-ideation
slots:
  - suicidal_ideation
  - self_harm_behavior
  - suicide_plan
  - acute_support_state
  - primary_concern
  - high_risk_flag
  - high_risk_reason
  - high_risk_screening_stage_summary
completion_outcomes:
  - safe_to_continue
  - human_intervention_required
nodes:
  - id: ask-suicidal-ideation
    type: speak_then_wait
    prompt: 最近有没有伤害自己或轻生的想法？
    extraction:
      strategy: risk_enum_parse
      target_slot: suicidal_ideation
      enums:
        - positive
        - negative
        - unclear
    branches:
      normal:
        next: evaluate-after-suicidal-ideation
      silence:
        after_seconds: 6
        next: evaluate-after-suicidal-ideation
      recognition_failure:
        next: evaluate-after-suicidal-ideation

  - id: evaluate-after-suicidal-ideation
    type: decision
    decision_rules:
      skip-to-primary-concern:
        any:
          - suicidal_ideation == negative
      safe_to_continue:
        default: true
    branches:
      skip-to-primary-concern: ask-primary-concern
      safe_to_continue: ask-plan-or-action

  - id: ask-plan-or-action
    type: speak_then_wait
    prompt: 有没有具体计划、差点实施，或者已经做过？
    extraction:
      strategy: risk_enum_parse
      target_slots:
        - suicide_plan
        - self_harm_behavior
      enums:
        - positive
        - negative
        - unclear
    branches:
      normal:
        next: evaluate-after-plan-or-action
      silence:
        after_seconds: 6
        next: evaluate-after-plan-or-action
      recognition_failure:
        next: evaluate-after-plan-or-action

  - id: evaluate-after-plan-or-action
    type: decision
    decision_rules:
      human_intervention_required:
        any:
          - suicide_plan == positive
          - self_harm_behavior == positive
      safe_to_continue:
        default: true
    branches:
      human_intervention_required: risk-screening-005
      safe_to_continue: ask-support-state

  - id: ask-support-state
    type: speak_then_wait
    prompt: 现在身边有没有家人、朋友、老师或同事可以及时联系和陪伴？
    extraction:
      strategy: risk_enum_parse
      target_slot: acute_support_state
      enums:
        - available
        - limited
        - none
        - unclear
    branches:
      normal:
        next: evaluate-after-support-state
      silence:
        after_seconds: 6
        next: evaluate-after-support-state
      recognition_failure:
        next: evaluate-after-support-state

  - id: evaluate-after-support-state
    type: decision
    decision_rules:
      human_intervention_required:
        any:
          - suicidal_ideation == positive and acute_support_state in [limited, none, unclear]
      safe_to_continue:
        default: true
    branches:
      human_intervention_required: risk-screening-005
      safe_to_continue: ask-primary-concern

  - id: ask-primary-concern
    type: speak_then_wait
    prompt: 这次就诊您最希望医生帮您解决什么问题？
    extraction:
      strategy: free_text
      target_slot: primary_concern
    branches:
      normal:
        next: evaluate-high-risk
      silence:
        after_seconds: 6
        next: evaluate-high-risk
      recognition_failure:
        next: evaluate-high-risk

  - id: evaluate-high-risk
    type: decision
    decision_rules:
      human_intervention_required:
        any:
          - suicide_plan == positive
          - self_harm_behavior == positive
          - suicidal_ideation == positive and acute_support_state in [limited, none, unclear]
      safe_to_continue:
        default: true
    branches:
      human_intervention_required: risk-screening-005
      safe_to_continue: stage-complete

  - id: risk-screening-005
    type: speak_then_complete
    prompt: 系统识别到您当前可能存在需要立即关注的安全风险。接下来我会暂停标准流程，并协助转入人工支持或进一步安全处理。
    next: stage-complete
