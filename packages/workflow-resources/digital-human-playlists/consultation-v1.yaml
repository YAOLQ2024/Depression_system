workflow_id: consultation-v1
manifest_contract: digital-human-playlist/v1
playlist_version: v1-8-questions
manifest_status: draft
delivery_mode: fixed-video-playlist
notes:
  - "8 question videos + 1 greeting video for consultation-v1"
  - "Each question item maps to one fixed video file."
  - "question_text is the authoritative text stored with each consultation turn."
  - "subtitle_text is an optional UI/display override; if omitted, UI can fall back to question_text."
  - "Video binaries stay in static assets or object storage; this manifest stores only metadata."

stages:
  - stage_id: stage-01-greeting-and-briefing
    stage_label: 问候说明
    stage_order: 1
    question_items:
      - question_key: greeting-001
        order: 1
        node_id: greeting-open
        video_asset_id: greeting-001
        video_uri: /digital-human/consultation-v1/greeting-001.webm
        question_text: 您好，我是您的专属AI辅助问诊医生。在接下来的10到15分钟里，我会先向您了解一些基本情况，然后会邀请您完成几个简单的测试，最后为您提供专属的调节建议。希望您能放松身心，根据实际情况作答。接下来，我们正式开始吧。
        subtitle_text: null
        response_required: false

  - stage_id: stage-02-chief-complaint
    stage_label: 主诉采集
    stage_order: 2
    question_items:
      - question_key: chief-complaint-001
        order: 1
        node_id: ask-chief-complaint-001
        video_asset_id: chief-complaint-001
        video_uri: /digital-human/consultation-v1/chief-complaint-001.webm
        question_text: 您今天主要是因为什么问题来就诊？
        subtitle_text: null
        response_required: true
      - question_key: chief-complaint-002
        order: 2
        node_id: ask-chief-complaint-002
        video_asset_id: chief-complaint-002
        video_uri: /digital-human/consultation-v1/chief-complaint-002.webm
        question_text: 这个问题大概是从什么时候开始的，持续多久了？
        subtitle_text: null
        response_required: true
      - question_key: chief-complaint-003
        order: 3
        node_id: ask-chief-complaint-003
        video_asset_id: chief-complaint-003
        video_uri: /digital-human/consultation-v1/chief-complaint-003.webm
        question_text: 目前最影响您生活、学习或工作的症状是什么？这些症状是第一次出现，还是以前也出现过类似症状？
        subtitle_text: null
        response_required: true

  - stage_id: stage-03-current-history-followup
    stage_label: 症状筛查
    stage_order: 3
    question_items:
      - question_key: current-history-001
        order: 1
        node_id: ask-current-history-001
        video_asset_id: current-history-001
        video_uri: /digital-human/consultation-v1/current-history-001.webm
        question_text: 最近有没有发生让您压力明显增加的事情？
        subtitle_text: null
        response_required: true
      - question_key: current-history-002
        order: 2
        node_id: ask-current-history-002
        video_asset_id: current-history-002
        video_uri: /digital-human/consultation-v1/current-history-002.webm
        question_text: 最近有没有反复想一件事停不下来，或者反复检查、确认、撕嘴皮、扣痘痘、抓头发、囤东西等控制不住的行为？
        subtitle_text: null
        response_required: true
      - question_key: current-history-003
        order: 3
        node_id: ask-current-history-003
        video_asset_id: current-history-003
        video_uri: /digital-human/consultation-v1/current-history-003.webm
        question_text: 最近有没有一段时间情绪异常高涨、精力特别旺盛、话变多、特别想社交，甚至睡得很少也不觉得累？
        subtitle_text: null
        response_required: true

  - stage_id: stage-04-high-risk-screening
    stage_label: 风险筛查
    stage_order: 4
    question_items:
      - question_key: risk-screening-001
        order: 1
        node_id: ask-suicidal-ideation
        video_asset_id: risk-screening-001
        video_uri: /digital-human/consultation-v1/risk-screening-001.webm
        question_text: 最近有没有伤害自己或轻生的想法、行为，或者具体计划？
        subtitle_text: null
        response_required: true
      - question_key: risk-screening-002
        order: 2
        node_id: ask-primary-concern
        video_asset_id: risk-screening-002
        video_uri: /digital-human/consultation-v1/risk-screening-002.webm
        question_text: 这次就诊您最希望医生帮您解决什么问题？
        subtitle_text: null
        response_required: true