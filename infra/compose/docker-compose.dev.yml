services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mcs
      POSTGRES_PASSWORD: mcs
      POSTGRES_DB: mcs
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcs -d mcs"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"

  identity-service:
    build:
      context: ../../services/identity-service
    environment:
      DATABASE_URL: postgresql://mcs:mcs@postgres:5432/mcs
      CORS_ORIGINS: http://127.0.0.1:3000,http://localhost:3000,http://127.0.0.1:3001,http://localhost:3001
      CORS_ORIGIN_REGEX: ^https?://[^/]+:(3000|3001)$
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready').read()"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "8011:8000"

  consultation-service:
    build:
      context: ../../services/consultation-service
    environment:
      DATABASE_URL: postgresql://mcs:mcs@postgres:5432/mcs
      MULTIMODAL_SERVICE_URL: http://multimodal-service:8000
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "false"
      CONSULTATION_BUCKET: mcs-consultation
      WORKFLOW_RESOURCES_DIR: /app/workflow-resources
      WORKFLOW_ID: consultation-v1
      SCRIPT_BUNDLE: rule-v1
      DEFAULT_DOCTOR_PERSONA: doctor-a-calm-female
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ../../packages/workflow-resources:/app/workflow-resources:ro
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready').read()"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "8012:8000"

  assessment-service:
    build:
      context: ../../services/assessment-service
    environment:
      DATABASE_URL: postgresql://mcs:mcs@postgres:5432/mcs
      MULTIMODAL_SERVICE_URL: http://multimodal-service:8000
      RISK_SERVICE_URL: http://risk-service:8000
      WORKFLOW_RESOURCES_DIR: /app/workflow-resources
      ACTIVE_SCALE_SET: v1
    depends_on:
      postgres:
        condition: service_healthy
      multimodal-service:
        condition: service_started
    volumes:
      - ../../packages/workflow-resources:/app/workflow-resources:ro
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready').read()"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "8013:8000"

  risk-service:
    build:
      context: ../../services/risk-service
    environment:
      DATABASE_URL: postgresql://mcs:mcs@postgres:5432/mcs
      CONSULTATION_SERVICE_URL: http://consultation-service:8000
      ASSESSMENT_SERVICE_URL: http://assessment-service:8000
      MULTIMODAL_SERVICE_URL: http://multimodal-service:8000
      WORKFLOW_RESOURCES_DIR: /app/workflow-resources
    depends_on:
      postgres:
        condition: service_healthy
      consultation-service:
        condition: service_started
      assessment-service:
        condition: service_started
      multimodal-service:
        condition: service_started
    volumes:
      - ../../packages/workflow-resources:/app/workflow-resources:ro
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready').read()"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "8014:8000"

  intervention-service:
    build:
      context: ../../services/intervention-service
    environment:
      DATABASE_URL: postgresql://mcs:mcs@postgres:5432/mcs
      WORKFLOW_RESOURCES_DIR: /app/workflow-resources
      INTERVENTION_CATALOG_DIR: /app/workflow-resources/intervention-programs
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../packages/workflow-resources:/app/workflow-resources:ro
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready').read()"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "8015:8000"

  followup-service:
    build:
      context: ../../services/followup-service
    environment:
      DATABASE_URL: postgresql://mcs:mcs@postgres:5432/mcs
      REPORT_EXPORT_DIR: /app/data/reports
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8016:8000"

  multimodal-service:
    build:
      context: ../../services/multimodal-service
    environment:
      DATABASE_URL: postgresql://mcs:mcs@postgres:5432/mcs
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0
      REDIS_KEY_PREFIX: mcs:multimodal
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "false"
      MULTIMODAL_BUCKET: mcs-multimodal
      RUNTIME_ASSETS_DIR: /app/runtime-assets
      DOLPHIN_MODEL_NAME: base.cn.streaming
      DOLPHIN_MODEL_DIR: /app/runtime-assets/asr/base.cn.streaming
      # Runtime assets are provisioned before deployment; never fetch models at startup.
      AUTO_FETCH_DOLPHIN_ASR: "false"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      ASR_DEVICE: auto
      ASR_SYNC_TIMEOUT_MS: 15000
      ASR_PREVIEW_MAX_DURATION_MS: 10000
      EEG_ENABLED: ${MCS_CONTAINER_EEG_ENABLED:-true}
      # Windows default path:
      # Docker multimodal-service consumes Redis Stream transport, while the
      # host runs eeg-tools bridge/replay as the only EEG entry.
      EEG_PROVIDER: ${MCS_CONTAINER_EEG_PROVIDER:-redis_stream}
      EEG_AUTO_START_TRANSPORT: ${MCS_CONTAINER_EEG_AUTO_START_TRANSPORT:-true}
      EEG_REQUIRE_TRANSPORT_FOR_READY: ${MCS_CONTAINER_EEG_REQUIRE_TRANSPORT_FOR_READY:-true}
      EEG_STREAM_KEY_PREFIX: ${EEG_STREAM_KEY_PREFIX:-mcs:eeg:transport}
      EEG_STREAM_CONSUMER_GROUP: ${EEG_STREAM_CONSUMER_GROUP:-multimodal-eeg}
      EEG_DEVICE_NAME_HINT: ${EEG_DEVICE_NAME_HINT:-EEG}
      EEG_NOTIFY_CHAR_UUID: 6e400003-b5a3-f393-e0a9-e50e24dcca9e
      EEG_CHANNEL_NAMES: T7,T8,Fpz
      EEG_SAMPLING_RATE: 500
      EEG_PREVIEW_SECONDS: 4
      EEG_WINDOW_SECONDS: 10
      EEG_MIN_FEATURE_FRAMES: 10
      EEG_EXPLANATIONS_ENABLED: ${EEG_EXPLANATIONS_ENABLED:-false}
      EEG_EXPLANATION_BACKGROUND_PATH: /app/runtime-assets/eeg/background.npz
      EEG_EXPLANATION_NSAMPLES: ${EEG_EXPLANATION_NSAMPLES:-512}
      EEG_EXPLANATION_MAX_BACKGROUND: ${EEG_EXPLANATION_MAX_BACKGROUND:-64}
      EEG_EXPLANATION_TIMEOUT_SECONDS: ${EEG_EXPLANATION_TIMEOUT_SECONDS:-45}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - ../../services/multimodal-service/runtime-assets:/app/runtime-assets
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready').read()"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${MCS_CONTAINER_MULTIMODAL_PORT:-18017}:8000"

  eeg-explanation-worker:
    profiles: [eeg-explanations]
    build:
      context: ../../services/multimodal-service
      dockerfile: Dockerfile.explanation
    environment:
      DATABASE_URL: postgresql://mcs:mcs@postgres:5432/mcs
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0
      REDIS_KEY_PREFIX: mcs:multimodal
      RUNTIME_ASSETS_DIR: /app/runtime-assets
      EEG_EXPLANATIONS_ENABLED: ${EEG_EXPLANATIONS_ENABLED:-false}
      EEG_EXPLANATION_BACKGROUND_PATH: /app/runtime-assets/eeg/background.npz
      EEG_EXPLANATION_NSAMPLES: ${EEG_EXPLANATION_NSAMPLES:-512}
      EEG_EXPLANATION_MAX_BACKGROUND: ${EEG_EXPLANATION_MAX_BACKGROUND:-64}
      EEG_EXPLANATION_TIMEOUT_SECONDS: ${EEG_EXPLANATION_TIMEOUT_SECONDS:-45}
    volumes:
      - ../../services/multimodal-service/runtime-assets:/app/runtime-assets:ro
    depends_on:
      multimodal-service:
        condition: service_healthy
    cpus: 1.0
    mem_limit: 768m
    restart: unless-stopped

  ai-service:
    profiles:
      - optional-ai
    build:
      context: ../../services/ai-service
    environment:
      DATABASE_URL: postgresql://mcs:mcs@postgres:5432/mcs
      LLM_PROVIDER: disabled
      LLM_BASE_URL: ""
      LLM_API_KEY: ""
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8018:8000"

  gateway-service:
    build:
      context: ../../services/gateway-service
    environment:
      IDENTITY_SERVICE_URL: http://identity-service:8000
      CONSULTATION_SERVICE_URL: http://consultation-service:8000
      ASSESSMENT_SERVICE_URL: http://assessment-service:8000
      RISK_SERVICE_URL: http://risk-service:8000
      INTERVENTION_SERVICE_URL: http://intervention-service:8000
      MULTIMODAL_SERVICE_URL: http://multimodal-service:8000
      WORKFLOW_RESOURCES_DIR: /app/workflow-resources
      CORS_ORIGINS: http://127.0.0.1:3000,http://localhost:3000,http://127.0.0.1:3001,http://localhost:3001
      CORS_ORIGIN_REGEX: ^https?://[^/]+:(3000|3001)$
    volumes:
      - ../../packages/workflow-resources:/app/workflow-resources:ro
    ports:
      - "18080:8000"
    depends_on:
      identity-service:
        condition: service_healthy
      consultation-service:
        condition: service_healthy
      assessment-service:
        condition: service_healthy
      risk-service:
        condition: service_healthy
      intervention-service:
        condition: service_healthy
      multimodal-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready').read()"]
      interval: 5s
      timeout: 5s
      retries: 20

  consultation:
    build:
      context: ../../apps/consultation
    ports:
      - "3000:8000"
    depends_on:
      gateway-service:
        condition: service_healthy

  operations-console:
    build:
      context: ../../apps/operations-console
    ports:
      - "3001:8000"
    depends_on:
      gateway-service:
        condition: service_healthy

volumes:
  postgres_data:
