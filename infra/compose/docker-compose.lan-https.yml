services:
  # Caddy owns the host-facing HTTP redirect ports (3000/3001). Keep the
  # application containers internal so their dev-mode published ports do not
  # collide with Caddy when this LAN HTTPS overlay is active.
  consultation:
    ports: !reset []
  operations-console:
    ports: !reset []
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      consultation:
        condition: service_started
      gateway-service:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../certs:/certs:ro
