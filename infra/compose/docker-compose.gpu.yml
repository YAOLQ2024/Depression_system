services:
  multimodal-service:
    build:
      args:
        BASE_IMAGE: nvcr.io/nvidia/pytorch:25.06-py3-igpu
        JETSON_GPU_ENABLED: "true"
    runtime: nvidia
    gpus: all
    environment:
      ASR_DEVICE: auto
      MCS_TENSORRT_ENABLED: "true"
      MODEL_PROVIDERS: CUDAExecutionProvider,CPUExecutionProvider
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      # Jetson's TensorRT Python runtime depends on this host-provided library,
      # but the NVIDIA container runtime does not mount it automatically.
      - /usr/lib/aarch64-linux-gnu/nvidia/libnvdla_compiler.so:/usr/lib/aarch64-linux-gnu/nvidia/libnvdla_compiler.so:ro
